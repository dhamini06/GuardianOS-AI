[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianos-ai"
version = "0.1.0"
description = "AI-powered, explainable Linux security assistant for kernel-level intrusion and behavioural threat detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GuardianOS-AI contributors" }]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
dev-full = [
    "mypy>=1.10",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.0",
    "build>=1.2",
]

[project.scripts]
guardian-server = "scripts.run_server:main"
guardian-security-scan = "scripts.scan_security:main"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.setuptools.package-data]
"backend.config" = ["*.yaml"]
"backend.dashboard.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["backend"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pip-audit]
skip-editable = true

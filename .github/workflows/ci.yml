name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: GuardianOS-AI

jobs:
  quality:
    name: Lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev-full]"
      - name: Ruff
        run: ruff check backend tests scripts
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  security:
    name: Security scan (SBOM + vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev-full]"
      - name: Scan
        run: python scripts/scan_security.py --output-dir build/security
      - name: Upload SBOM + audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: GuardianOS-AI/build/security/*.json

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install ".[dev-full]"
      - name: Build wheel
        run: python -m build --wheel --outdir dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: GuardianOS-AI/dist/*.whl

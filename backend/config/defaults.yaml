# GuardianOS-AI default configuration.
# Override via a user file or dotted command-line overrides, e.g.
#   {"telemetry.window_seconds": 120}

log_level: INFO
data_dir: data

telemetry:
  provider: process_monitor   # process_monitor | demo_generator | auditd | tracee | bpf
  polling_interval_seconds: 2.0
  window_seconds: 60
  audit_log_path: /var/log/audit/audit.log   # used by the auditd provider
  ring_capacity: 10000       # bounded ring of parsed events at the source
  max_events_per_collect: 500  # per-collect budget; excess waits for next tick
  rate_limit_per_second: 0   # 0 = unlimited; else token-bucket cap on delivery
  subprocess_queue_capacity: 10000  # bounded stdout queue for the tracee subprocess
  subprocess_auto_restart: true      # restart tracee-ebpf if it exits unexpectedly
  subprocess_restart_backoff_seconds: 1.0  # initial restart backoff (exponential, capped)

detection:
  contamination: 0.01         # expected anomaly share for Isolation Forest
  n_estimators: 200
  max_samples: 256
  normalise_threshold: 0.75   # score above which a sample is "normal" scale max
  flagged_threshold: 0.60     # normalised anomaly score to be considered a threat
  min_baseline_samples: 25    # feature vectors required before baseline fits
  model_path: null            # persisted model path; null = in-memory baseline
  autoload: true              # load a persisted model on boot if model_path exists
  refit_interval_windows: 10  # refit the baseline every N scored windows
  baseline_max_samples: 400   # sliding-window cap for the online baseline
  attribution_background_samples: 64  # SHAP-style attribution sample budget

explainability:
  narrative_provider: rules    # rules | llm (offline/local model, optional)
  llm_endpoint: http://127.0.0.1:11434  # Ollama-compatible local endpoint
  llm_model: llama3.2:1b
  llm_timeout_seconds: 10.0

response:
  auto_approve_destructive: false
  dry_run: true               # MVP is always dry-run safe
  playbook_path: null         # YAML playbook rules; null = config/playbooks.yaml built-ins
  audit_path: audit.jsonl     # append-only, signed audit trail under data_dir
  signing_secret: null        # HMAC secret for audit signatures; set via GUARDIAN_SIGNING_SECRET

storage:
  enabled: true
  path: guardian.db           # SQLite file under data_dir
  save_events: true
  save_reports: true
  max_events: 100000          # sliding-window cap for persisted events

dashboard:
  refresh_seconds: 3.0

server:
  host: 127.0.0.1
  port: 8000
  refresh_seconds: 1.0   # pipeline driver tick + WebSocket push cadence

auth:
  enabled: false          # demo default (all roles); enable + set tokens in production
  token_header: X-GUARDIAN-TOKEN
  default_role: viewer
  users:                  # per-user tokens, overridable via GUARDIAN_TOKEN_<NAME> env
    - name: admin
      token: change-me-admin
      roles: [admin]
    - name: analyst
      token: change-me-analyst
      roles: [analyst]
    - name: viewer
      token: change-me-viewer
      roles: [viewer]
